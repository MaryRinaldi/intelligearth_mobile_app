plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id("com.google.android.libraries.mapsplatform.secrets-gradle-plugin")
}

android {
    namespace "com.example.intelligearth_mobile"
    compileSdkVersion 34
    
    defaultConfig {
        applicationId = "com.example.intelligearth_mobile"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode = 1
        versionName = "1.0.0+1"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            def googleMapsApiKey = project.hasProperty("GOOGLE_MAPS_API_KEY") ? project.GOOGLE_MAPS_API_KEY : "DEFAULT_API_KEY"
            buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${googleMapsApiKey}\""

        }
        debug {
        def googleMapsApiKey = project.hasProperty("GOOGLE_MAPS_API_KEY") ? project.GOOGLE_MAPS_API_KEY : "DEFAULT_API_KEY"
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${googleMapsApiKey}\""

           }
    }

   compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.libraries.places:places:3.3.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

secrets {
    propertiesFileName = project.rootProject.file("secrets.properties")
    defaultPropertiesFileName = project.rootProject.file("local.defaults.properties")
}